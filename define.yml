# =============================================================================
# Agent Memory 配置
# =============================================================================
# 定义每个agent的memory namespace、存储内容和操作
memory:
  # 全局配置
  config:
    backend: "hybrid"  # hybrid: SQLite + AgentDB (HNSW索引)
    path: "./data/memory"
    enable_vector_search: true
    session_retention_days: 30
    longterm_retention_days: 365

  # Agent Memory Namespaces - 每个agent独立的memory空间
  namespaces:
    # =====================================================================
    # 规格阶段 Agents
    # =====================================================================
    - namespace: "spec-architect"
      agent_id: "spec-architect"
      description: "系统架构师记忆存储"
      keys:
        - key: "architecture_decisions"
          description: "架构决策记录"
          type: "longterm"
        - key: "system_requirements"
          description: "系统需求分析"
          type: "longterm"
        - key: "performance_targets"
          description: "性能目标定义"
          type: "longterm"

    - namespace: "spec-writer"
      agent_id: "spec-writer"
      description: "规格文档工程师记忆存储"
      keys:
        - key: "module_specs"
          description: "模块规格文档"
          type: "longterm"
        - key: "interface_definitions"
          description: "接口定义"
          type: "longterm"
        - key: "timing_specs"
          description: "时序规格"
