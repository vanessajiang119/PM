# =============================================================================
# MCP工具配置 (来自 eda_agent)
# =============================================================================
mcp_tools:
  verilog_tools:
    - name: "iverilog"
      description: "ICARUS Verilog 编译器"
      version: ">=12.0"
      commands:
        compile: "iverilog -g2012 -o {output} {tb_file} {rtl_file} -I{include_dir}"
        run: "vvp {compiled_file}"

    - name: "verilator"
      description: "Verilog仿真和lint工具"
      commands:
        compile: "verilator --cc --exe --build {rtl_file} {tb_file}"
        run: "./obj_dir/V{module_name}"
        lint: "verilator --lint-only {rtl_file}"

  mcp_servers:
    - name: "verilog_mcp"
      description: "Verilog代码分析MCP服务器"
      path: "/root/workspace/eda_agent/verilog_mcp"
      tools:
        - name: "verilog_syntax_check"
          description: "验证Verilog/SystemVerilog语法"
        - name: "verilog_list_modules"
          description: "列出代码中的所有模块定义"
        - name: "verilog_analyze_signals"
          description: "分析信号声明和使用"

