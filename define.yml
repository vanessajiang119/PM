          description: "风险评估"
          type: "session"

    # =====================================================================
    # 项目管理和集成
    # =====================================================================
    - namespace: "chip-project-manager"
      agent_id: "chip-project-manager"
      description: "芯片项目经理记忆存储"
      keys:
        - key: "project_plan"
          description: "项目计划"
          type: "longterm"
        - key: "milestone_tracking"
          description: "里程碑跟踪"
          type: "longterm"
        - key: "risk_registry"
          description: "风险登记"
          type: "longterm"
        - key: "resource_allocation"
          description: "资源分配"
          type: "session"

    - namespace: "ip-integrator"
      agent_id: "ip-integrator"
      description: "IP集成工程师记忆存储"
      keys:
        - key: "integration_history"
          description: "集成历史"
          type: "longterm"
        - key: "interface_connections"
          description: "接口连接"
          type: "longterm"

  # Memory 操作接口
  operations:
    store: |
      # 存储memory
      npx claude-flow@v3alpha memory store \
        --namespace {agent_namespace} \
        --key "{memory_key}" \
        --value "{memory_value}"

    retrieve: |
      # 检索memory
      npx claude-flow@v3alpha memory retrieve \
        --namespace {agent_namespace} \
        --key "{memory_key}"

    search: |
      # 向量搜索
      npx claude-flow@v3alpha memory search \
        --namespace {agent_namespace} \
        --query "{search_query}"

    list: |
      # 列出所有keys
      npx claude-flow@v3alpha memory list \
        --namespace {agent_namespace}

  # 调试过程记忆示例 (每个agent的典型调试记录)
