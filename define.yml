# =============================================================================
# 芯片研发流程 Agent 体系定义
# =============================================================================
# 项目: 芯片研发管理流程 (从规格书到GDS)
# 版本: 1.0.0
# 创建日期: 2026-03-22
# 框架: ruflo (claude-flow v3.5)
# =============================================================================

# 项目元数据
project:
  name: "芯片研发流程管理系统"
  description: "支持从规格书到GDS的全流程芯片研发管理"
  version: "1.0.0"
  framework: "ruflo"
  framework_version: "3.5.0"

# =============================================================================
# 可行性分析
# =============================================================================
feasibility:
  summary: |
    使用ruflo框架实现芯片研发管理流程是可行的，原因如下：

    1. 多Agent协作能力 - ruflo支持多层次Agent体系，可模拟芯片设计各角色
    2. 记忆系统 - 可追踪设计规格、验证状态、问题记录
    3. 工作流支持 - 可定义从规格到GDS的线性/并行流程
    4. 状态管理 - 支持复杂状态机，适合芯片设计各阶段Gate Review

  advantages:
    - 支持层次化任务分解（系统→子系统→模块）
    - 可定制化的Agent类型匹配芯片设计角色
    - 向量记忆支持设计知识积累和复用
    - 支持与EDA工具的命令行集成

  challenges:
    - 芯片设计涉及大量专业EDA工具，需要 wrapper 集成
    - 时序约束、功耗分析等专业领域知识需要专门训练
    - 形式验证、物理验证等需要领域特定工具链

  recommendations:
    - 初期聚焦RTL设计和验证流程的自动化
    - 逐步扩展到综合和物理设计阶段
    - 需要为每个专业工具创建 skill/agent
    - 建议与专业芯片设计平台集成

# =============================================================================
# Agent 类型定义
# =============================================================================
agent_types:
  # -------------------------------------------------------------------------
  # 阶段1: 规格书阶段 (Specification Phase)
  # -------------------------------------------------------------------------
  - id: "spec-architect"
    name: "系统架构师"
    type: "architect"
    phase: "specification"
    description: "负责芯片系统规格定义和架构设计"
    capabilities:
      - "系统需求分析"
      - "架构设计"
      - "性能参数定义"
      - "接口规格定义"
    skills:
      - "architecture-design"
      - "performance-modeling"
      - "interface-specification"
      - "spec-enrichment"
    tools:
      - "memory-store"
      - "memory-search"
    optimization: "context-caching"

  - id: "spec-writer"
    name: "规格文档工程师"
    type: "coder"
    phase: "specification"
    description: "负责编写详细的模块规格文档"
    capabilities:
      - "功能规格编写"
      - "接口定义"
      - "时序规格"
      - "功耗规格"
      - "测试策略定义"
    skills:
      - "technical-writing"
      - "specification-template"
      - "spec-enrichment"
    tools:
      - "memory-store"
      - "task-create"

  - id: "spec-reviewer"
    name: "规格评审员"
    type: "reviewer"
    phase: "specification"
    description: "负责评审规格文档的完整性和一致性"
    capabilities:
      - "规格完整性检查"
      - "一致性分析"
      - "可实现性评估"
      - "风险识别"
    skills:
      - "review-checklist"
      - "consistency-analysis"
    tools:
      - "memory-search"
      - "task-assign"

  # -------------------------------------------------------------------------
  # 阶段2: RTL开发阶段 (RTL Development)
  # -------------------------------------------------------------------------
  - id: "rtl-developer"
    name: "RTL工程师"
    type: "coder"
    phase: "rtl-development"
    description: "负责RTL代码编写和实现"
    capabilities:
      - "Verilog/SystemVerilog编码"
      - "模块设计"
      - "编码规范遵循"
      - "可综合性设计"
      - "SPEC注释规范编写"
    skills:
      - "verilog-coding"
      - "systemverilog"
      - "rtl-optimization"
    tools:
      - "memory-store"
      - "task-create"
      - "bash"
    optimization: "context-caching"

  - id: "verification-engineer"
    name: "验证工程师"
    type: "tester"
    phase: "rtl-development"
    description: "负责RTL功能验证和仿真"
    capabilities:
      - "UVM验证环境搭建"
      - "测试用例开发"
      - "覆盖率收集"
      - "验证计划执行"
    skills:
      - "uvm-testing"
      - "systemverilog-uvm"
      - "coverage-analysis"
    tools:
      - "memory-store"
      - "task-assign"

  - id: "debug-engineer"
    name: "调试工程师"
    type: "researcher"
    phase: "rtl-development"
    description: "负责RTL仿真调试和问题定位"
    capabilities:
      - "波形分析"
      - "问题定位"
      - "回归测试"
      - "Bug跟踪"
    skills:
      - "waveform-analysis"
      - "debugging"
      - "regression-testing"
    tools:
      - "memory-search"
      - "memory-store"

  - id: "rtl-reviewer"
    name: "RTL评审员"
    type: "reviewer"
    phase: "rtl-development"
    description: "负责RTL代码评审和质量把控"
    capabilities:
      - "代码风格检查"
      - "可综合性审查"
      - "CDC/CME分析"
      - "功耗分析"
      - "SPEC合规性验证"
    skills:
      - "code-review"
      - "synthesis-check"
      - "cdc-analysis"
      - "verilog-code-review"
    tools:
      - "memory-search"
      - "task-status"

  # -------------------------------------------------------------------------
  # RTL开发阶段 - EDA Agent 增强 (来自 eda_agent)
  # -------------------------------------------------------------------------
  - id: "rtl-editor"
    name: "RTL编辑器"
    type: "coder"
    phase: "rtl-development"
    description: "根据审查反馈修改RTL代码"
    capabilities:
      - "定位并修复设计错误"
      - "优化代码结构和性能"
      - "修复时序问题"
      - "添加调试信号"
    skills:
      - "rtl-fix"
      - "code-refactoring"
    tools:
      - "memory-store"
      - "task-create"

  - id: "tb-generator"
    name: "测试台生成工程师"
    type: "coder"
    phase: "rtl-development"
    description: "为RTL设计生成验证测试台"
    capabilities:
      - "生成SystemVerilog测试台"
      - "编写自检测测试用例"
      - "生成随机约束测试"
      - "添加覆盖率监测点"
    skills:
      - "testbench-generation"
      - "sv-uvm"
    tools:
      - "memory-store"
      - "task-create"

  - id: "simulator"
    name: "仿真工程师"
    type: "tester"
    phase: "rtl-development"
    description: "编译并运行RTL仿真"
    capabilities:
      - "使用iverilog编译"
      - "使用verilator仿真"
      - "解析仿真波形"
      - "生成仿真报告"
    skills:
      - "iverilog-compilation"
      - "verilator-simulation"
    tools:
      - "memory-store"
      - "bash"

  - id: "sim-reviewer"
    name: "仿真审查员"
    type: "reviewer"
    phase: "rtl-development"
    description: "分析仿真结果，识别设计错误"
    capabilities:
      - "解析仿真输出日志"
      - "识别测试失败原因"
      - "分析波形信号"
      - "生成问题报告"
    skills:
      - "simulation-analysis"
      - "waveform-analysis"
    tools:
      - "memory-search"
      - "memory-store"

  - id: "sim-judge"
    name: "验证决策员"
    type: "reviewer"
    phase: "rtl-development"
    description: "综合验证结果做出最终判定"
    capabilities:
      - "评估测试通过率"
      - "检查覆盖率指标"
      - "做出pass/fail判定"
      - "生成最终验证报告"
    skills:
      - "verification-judgment"
      - "coverage-assessment"
    tools:
      - "memory-search"
      - "task-status"

  - id: "coverage-analyzer"
    name: "覆盖率分析员"
    type: "tester"
    phase: "rtl-development"
    description: "分析代码覆盖率和功能覆盖率"
    capabilities:
      - "分析行覆盖率"
      - "分析分支覆盖率"
      - "分析状态机覆盖率"
      - "生成覆盖率报告"
    skills:
      - "coverage-analysis"
      - "line-coverage"
      - "branch-coverage"
      - "fsm-coverage"
    tools:
      - "memory-store"
      - "bash"

  # -------------------------------------------------------------------------
  # 阶段3: 综合与网表阶段 (Synthesis & Netlist)
  # -------------------------------------------------------------------------
  - id: "synthesis-engineer"
    name: "综合工程师"
    type: "coder"
    phase: "synthesis"
    description: "负责RTL到网表的逻辑综合"
    capabilities:
      - "逻辑综合"
      - "约束编写"
      - "时序优化"
      - "功耗优化"
    skills:
      - "design-compiler"
      - "synthesis-constraints"
      - "power-optimization"
    tools:
      - "memory-store"
      - "task-create"

  - id: "dft-engineer"
    name: "DFT工程师"
    type: "coder"
    phase: "synthesis"
    description: "负责可测试性设计"
    capabilities:
      - "Scan插入"
      - "ATPG生成"
      - "MBIST设计"
      - "边界扫描"
    skills:
      - "dft-compiler"
      - "scan-insertion"
      - "mbist-design"
    tools:
      - "memory-store"

  - id: "formal-verification-engineer"
    name: "形式验证工程师"
    type: "reviewer"
    phase: "synthesis"
    description: "负责形式验证"
    capabilities:
      - "等效性检查"
      - "属性验证"
      - "形式分析"
    skills:
      - "formality"
      - "property-checking"
    tools:
      - "memory-search"

  - id: "netlist-reviewer"
    name: "网表评审员"
    type: "reviewer"
    phase: "synthesis"
    description: "负责网表质量评审"
    capabilities:
      - "网表完整性检查"
      - "时序验收"
      - "功耗评估"
    tools:
      - "memory-search"

  # -------------------------------------------------------------------------
  # 阶段4: 物理设计阶段 (Physical Design)
  # -------------------------------------------------------------------------
  - id: "physical-designer"
    name: "物理设计工程师"
    type: "coder"
    phase: "physical-design"
    description: "负责布局布线和物理实现"
    capabilities:
      - "布局规划"
      - "自动布局布线"
      - "时钟树综合"
      - "布线优化"
    skills:
      - "icc2"
      - "innovus"
      - "cts-optimization"
    tools:
      - "memory-store"
      - "task-create"

  - id: "sta-engineer"
    name: "静态时序分析工程师"
    type: "reviewer"
    phase: "physical-design"
    description: "负责时序分析和收敛"
    capabilities:
      - "时序分析"
      - "时序收敛"
      - "时序优化建议"
      - "时序签名审查"
    skills:
      - "primetime"
      - "timing-closure"
      - "crosstalk-analysis"
    tools:
      - "memory-search"
      - "memory-store"

  - id: "physical-verification-engineer"
    name: "物理验证工程师"
    type: "tester"
    phase: "physical-design"
    description: "负责DRC/LVS验证"
    capabilities:
      - "DRC检查"
      - "LVS检查"
      - "ERC检查"
      - "天线效应检查"
    skills:
      - "calibre"
      - "dragon"
      - "drc-fix"
    tools:
      - "memory-store"

  - id: "power-engineer"
    name: "功耗工程师"
    type: "architect"
    phase: "physical-design"
    description: "负责功耗分析和优化"
    capabilities:
      - "动态功耗分析"
      - "静态功耗分析"
      - "功耗优化"
      - "功耗签名"
    skills:
      - "power-analysis"
      - "power-optimization"
    tools:
      - "memory-store"

  # -------------------------------------------------------------------------
  # 阶段5: GDS输出阶段 (GDS Output)
  # -------------------------------------------------------------------------
  - id: "gds-engineer"
    name: "GDS工程师"
    type: "coder"
    phase: "gds-output"
    description: "负责最终GDS文件生成"
    capabilities:
      - "GDSII生成"
      - "版图验证"
      - "数据输出"
      - "版图检查"
    skills:
      - "gds-generation"
      - "layout-verification"
    tools:
      - "memory-store"

  - id: "tapeout-reviewer"
    name: "Tapeout评审员"
    type: "reviewer"
    phase: "gds-output"
    description: "负责最终Tapeout评审"
    capabilities:
      - "数据完整性检查"
      - "签收确认"
      - "风险评估"
    tools:
      - "memory-search"

  # -------------------------------------------------------------------------
  # 项目管理和协调
  # -------------------------------------------------------------------------
  - id: "chip-project-manager"
    name: "芯片项目经理"
    type: "coordinator"
    phase: "all"
    description: "负责整个芯片项目的协调和管理"
    capabilities:
      - "项目计划制定"
      - "进度跟踪"
      - "资源协调"
      - "风险管理"
      - "里程碑管理"
    skills:
      - "project-management"
      - "risk-management"
      - "milestone-tracking"
    tools:
      - "task-create"
      - "task-assign"
      - "task-status"
      - "memory-store"

  - id: "ip-integrator"
    name: "IP集成工程师"
    type: "architect"
    phase: "all"
    description: "负责IP集成和系统集成"
    capabilities:
      - "IP集成"
      - "系统集成"
      - "接口调试"
      - "系统验证"
    skills:
      - "ip-integration"
      - "system-integration"
    tools:
      - "memory-store"
      - "memory-search"

# =============================================================================
# 工作流定义
# =============================================================================
workflows:
  # -------------------------------------------------------------------------
  # 主流程: 规格书到GDS
  # -------------------------------------------------------------------------
  - id: "chip-design-main"
    name: "芯片设计主流程"
    description: "从规格书到GDS的完整芯片设计流程"
    topology: "hierarchical"
    max_agents: 12
    strategy: "specialized"
    phases:
      - name: "规格阶段"
        duration: "2-4周"
        gate: "SPEC Review"
        agents:
          - "spec-architect"
          - "spec-writer"
          - "spec-reviewer"

      - name: "RTL开发阶段"
        duration: "4-8周"
        gate: "RTL Review"
        agents:
          - "rtl-developer"
          - "rtl-reviewer"
          - "rtl-editor"
          - "tb-generator"
          - "simulator"
          - "sim-reviewer"
          - "sim-judge"
          - "coverage-analyzer"
          - "debug-engineer"

      - name: "综合阶段"
        duration: "2-4周"
        gate: "Synthesis Review"
        agents:
          - "synthesis-engineer"
          - "dft-engineer"
          - "formal-verification-engineer"
          - "netlist-reviewer"

      - name: "物理设计阶段"
        duration: "4-8周"
        gate: "Physical Review"
        agents:
          - "physical-designer"
          - "sta-engineer"
          - "physical-verification-engineer"
          - "power-engineer"

      - name: "GDS输出阶段"
        duration: "1-2周"
        gate: "Tapeout Review"
        agents:
          - "gds-engineer"
          - "tapeout-reviewer"

    dependencies:
      - from: "SPEC Review"
        to: "RTL Review"
        condition: "spec_approved == true"

      - from: "RTL Review"
        to: "Synthesis Review"
        condition: "rtl_approved == true"

      - from: "Synthesis Review"
        to: "Physical Review"
        condition: "netlist_approved == true"

      - from: "Physical Review"
        to: "Tapeout Review"
        condition: "physical_approved == true"

  # -------------------------------------------------------------------------
  # 子流程: 规格评审
  # -------------------------------------------------------------------------
  - id: "spec-review-workflow"
    name: "规格评审流程"
    description: "芯片规格书的评审和批准流程"
    topology: "mesh"
    max_agents: 3
    agents:
      - "spec-writer"
      - "spec-reviewer"
      - "chip-project-manager"
    steps:
      - "规格文档编写"
      - "内部评审"
      - "跨团队评审"
      - "修订和完善"
      - "正式批准"

  # -------------------------------------------------------------------------
  # 子流程: RTL开发验证 (EDA Agent 增强版)
  # -------------------------------------------------------------------------
  - id: "rtl-dev-verif-workflow"
    name: "RTL开发验证流程"
    description: "RTL代码开发和验证的完整流程 (集成eda_agent验证循环)"
    topology: "hierarchical"
    max_agents: 10
    strategy: "specialized"
    agents:
      - "rtl-developer"
      - "rtl-reviewer"
      - "rtl-editor"
      - "tb-generator"
      - "simulator"
      - "sim-reviewer"
      - "sim-judge"
      - "coverage-analyzer"
      - "debug-engineer"
    steps:
      - "spec-parser: 规格解析"
      - "rtl-developer: RTL生成"
      - "rtl-reviewer: RTL代码审查"
      - "tb-generator: 测试台生成"
      - "simulator: 仿真运行"
      - "coverage-analyzer: 覆盖率分析"
      - "sim-reviewer: 仿真结果审查"
      - "sim-judge: 验证决策"
      - "rtl-editor: RTL编辑修复 (如需)"
      - "循环至仿真运行直至通过"

  # -------------------------------------------------------------------------
  # 子流程: 综合与DFT
  # -------------------------------------------------------------------------
  - id: "synthesis-dft-workflow"
    name: "综合与DFT流程"
    description: "逻辑综合和可测试性设计流程"
    topology: "hierarchical"
    max_agents: 4
    agents:
      - "synthesis-engineer"
      - "dft-engineer"
      - "formal-verification-engineer"
      - "netlist-reviewer"
    steps:
      - "综合约束准备"
      - "逻辑综合"
      - "DFT插入"
      - "形式验证"
      - "网表签收"

  # -------------------------------------------------------------------------
  # 子流程: 物理设计
  # -------------------------------------------------------------------------
  - id: "physical-design-workflow"
    name: "物理设计流程"
    description: "从网表到GDS的物理设计流程"
    topology: "hierarchical"
    max_agents: 6
    agents:
      - "physical-designer"
      - "sta-engineer"
      - "physical-verification-engineer"
      - "power-engineer"
    steps:
      - "布局规划"
      - "功耗分析"
      - "自动布局布线"
      - "时钟树综合"
      - "静态时序分析"
      - "DRC/LVS修复"
      - "时序收敛"

  # -------------------------------------------------------------------------
  # 子流程: Tapeout
  # -------------------------------------------------------------------------
  - id: "tapeout-workflow"
    name: "Tapeout流程"
    description: "最终GDS输出和Tapeout评审流程"
    topology: "star"
    max_agents: 3
    agents:
      - "gds-engineer"
      - "tapeout-reviewer"
      - "chip-project-manager"
    steps:
      - "最终版图检查"
      - "数据准备"
      - "Tapeout评审"
      - "数据提交"

# =============================================================================
# 里程碑定义
# =============================================================================
milestones:
  - id: "M0"
    name: "项目启动"
    phase: "specification"
    criteria:
      - "项目章程批准"
      - "团队组建完成"
      - "初步规格定义"

  - id: "M1"
    name: "规格完成"
    phase: "specification"
    criteria:
      - "系统规格文档完成"
      - "模块规格文档完成"
      - "SPEC Review通过"

  - id: "M2"
    name: "RTL freeze"
    phase: "rtl-development"
    criteria:
      - "所有模块RTL完成"
      - "功能仿真通过"
      - "覆盖率达标"
      - "RTL Review通过"

  - id: "M3"
    name: "综合完成"
    phase: "synthesis"
    criteria:
      - "网表生成完成"
      - "形式验证通过"
      - "DFT插入完成"

  - id: "M4"
    name: "物理设计完成"
    phase: "physical-design"
    criteria:
      - "布局布线完成"
