# =============================================================================
# RAG (检索增强生成) 配置
# =============================================================================
# 支持1000+页专业芯片设计文档的RAG系统
rag:
  # 全局配置
  config:
    enabled: true
    version: "1.0.0"
    description: "芯片设计RAG检索系统 - 支持多Agent角色文档管理"

  # 目录配置
  directories:
    root: "./rag"
    documents: "./rag/documents"
    data: "./rag/data"
    scripts: "./rag/scripts"
    logs: "./rag/logs"

    # 按Agent角色分类的文档目录
    agent_directories:
      - agent: "spec-architect"
        path: "spec-architect"
        description: "系统架构师文档"
