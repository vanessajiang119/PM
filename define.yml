  # 向量数据库配置
  vector_db:
    type: "chroma"               # ChromaDB
    persist_directory: "./rag/data/chroma"
    collection_name: "chip_design"

    # HNSW索引优化 (支持大数据量)
    hnsw_config:
      ef_construction: 200
      ef_search: 200
      M: 16
      metric: "cosine"

    # 索引优化
    index_optimization:
      incremental_update: true
      batch_indexing: true
      num_workers: 4

  # 文档分块配置
  chunking:
    # 基础参数
    chunk_size: 1024             # tokens
    chunk_overlap: 128           # tokens

    # 文档类型自适应
    by_document_type:
      technical_specs:
        chunk_size: 2048
        overlap: 256
      code_documentation:
        chunk_size: 512
        overlap: 64
        preserve_language: true
      user_guides:
        chunk_size: 1024
        overlap: 128

    # 特殊格式处理
    special_handling:
      tables: "extract_as_json"
      figures: "ocr_and_describe"
      formulas: "latex_preserve"

  # Embedding模型配置
  embedding:
    model: "text-embedding-3-large"
    dimensions: 3072
    batch_size: 1000

    # 本地模型备选
    local_models:
      - name: "bge-m3"
        dimension: 1024
        quantized: true

  # 检索配置
  retrieval:
    # 多路召回
    multi_way_recall:
      - method: "semantic"
        weight: 0.4
      - method: "keyword"
        weight: 0.3
        engine: "bm25"
      - method: "exact"
        weight: 0.2
      - method: "agent_specific"
        weight: 0.1

    # 重排序
    reranking:
      enabled: true
      model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
      top_k: 10

    # 查询预处理
    query_processing:
      expand_query: true
      expand_with_synonyms: true
      language_detection: true

    # 上下文窗口
    context_window:
      max_chunks: 10
      max_tokens: 8000
      aggregate_strategy: "longest"

  # 大文档处理 (1000+页)
  large_document_handling:
    # 文档结构感知
    structure_aware:
      enabled: true
      detect_sections: true
      detect_headings: true
      table_of_contents: true

    # 摘要预生成
    summarization:
      enabled: true
      summary_chunk_size: 10     # 每10页生成摘要
      store_summaries: true

    # 多级检索
    multi_level:
      enabled: true
      levels:
        - name: "overview"
          chunk_size: 4096
        - name: "detail"
          chunk_size: 1024
        - name: "reference"
          chunk_size: 512

    # 增量索引
    incremental:
      enabled: true
      track_modifications: true
      update_strategy: "smart"

    # 性能优化
    performance:
      cache_embeddings: true
      parallel_processing: true
      memory_limit: "16GB"
      batch_processing: true

  # Agent特定RAG
  agent_rag:
    spec-architect:
      preferred_sources: ["spec-architect", "common"]
      search_depth: "detailed"
      include_cross_references: true

    rtl-developer:
      preferred_sources: ["rtl-developer", "common"]
      include_code_examples: true
      search_related_ip: true

    verification-engineer:
      preferred_sources: ["verification-engineer", "common"]
      include_uvm_examples: true

    # 跨Agent知识共享
    cross_agent:
      enabled: true
      shared_sources: ["common", "shared"]
      reference_other_agents: true

  # 后处理配置
  post_processing:
    # 结果去重
    deduplication:
      enabled: true
      similarity_threshold: 0.95

    # 结果排序
    ranking:
      diversity_weight: 0.2
      recency_weight: 0.1
      authority_weight: 0.1

    # 结果格式化
    formatting:
      include_source: true
      include_page_number: true
      include_relevance_score: true
      max_source_length: 200

  # API接口配置
  api:
    enabled: true
    host: "0.0.0.0"
    port: 8000
    endpoints:
      - path: "/rag/ingest"
        method: "POST"
        description: "上传文档并索引"
      - path: "/rag/query"
        method: "POST"
        description: "RAG查询"
      - path: "/rag/rebuild"
        method: "POST"
        description: "重建索引"
      - path: "/rag/stats"
        method: "GET"
        description: "获取RAG统计信息"

  # 与现有系统集成
  integration:
    # 与Agent Skills集成
    agent_integration:
      hook_name: "on_rag_query"
      auto_retrieve: true

    # Memory系统集成
    memory_integration:
      store_rag_results: true
      context_window: 5

  # 依赖项
  requirements:
    python_packages:
      - "chromadb>=0.4.0"
      - "langchain>=0.1.0"
      - "langchain-community>=0.0.10"
      - "pypdf>=3.0.0"
      - "pydantic>=2.0.0"
      - "tiktoken>=0.5.0"
      - "faiss-cpu"

    system_requirements:
      python_version: ">=3.11"
      memory: "16GB"
      disk_space: "100GB"

